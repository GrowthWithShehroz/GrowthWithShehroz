name: EAS Production Build (Android)

on:
  workflow_dispatch:
    inputs:
      message:
        description: Build message
        required: false
        default: Manual production build

jobs:
  build:
    name: EAS Android Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/islamic-wisdom-app-continue-6tip4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android production AAB
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: 1c5702a2-5c9e-4bff-909e-1dadda166f73
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
